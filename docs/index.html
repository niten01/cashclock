<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f5f4ee">
  <meta name="description" content="A persistent money stopwatch in rubles."><title>Cashclock — Money stopwatch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23d6f279'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-size='68' font-family='sans-serif'%3E₽%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header><a class="brand" href="./" aria-label="Cashclock home"><span class="brand-icon">₽</span>cashclock</a><div class="today" id="today"></div></header>
    <main>
      <section class="timer-card" aria-label="Money stopwatch">
        <div class="card-top"><span class="section-label">SESSION</span><span class="status" id="status"><span></span>Idle</span></div>
        <div class="earnings"><span class="money" id="money">0<span class="decimal">.00</span></span><span class="currency">₽</span></div>
        <p class="earned-label" id="earned-label">Earned</p>
        <div class="timer-line"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6M12 2v3"/></svg><span id="elapsed">00:00:00</span><span class="time-label">time elapsed</span></div>
        <button class="primary" id="toggle"><svg id="button-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l12-7z"/></svg><span id="button-text">Start</span><span class="button-shortcut" aria-hidden="true">↵</span></button>
        <div class="session-foot"><span class="saved-indicator"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span id="save-note">Saved on this device</span></span><span id="session-start"></span></div>
      </section>
      <div class="settings-grid">
        <section class="setting-card"><div class="setting-heading"><label for="rate">Hourly rate</label></div><div class="rate-input"><input id="rate" type="number" min="0.01" max="100000000" step="0.01" inputmode="decimal" value="1000" aria-describedby="rate-note"><span>₽ <span class="per-hour">/ hour</span></span></div><p id="rate-note" hidden>Rate locked during session</p></section>
        <section class="setting-card start-card"><div class="setting-heading"><label for="start-mode">Start time</label></div><div class="start-controls"><select id="start-mode" aria-label="Start time"><option value="now">Now</option><option value="custom">Custom</option></select><button id="edit-start" class="text-button" hidden>Adjust</button></div><input id="custom-start" type="datetime-local" aria-label="Custom start date and time" hidden><p id="start-note" hidden></p></section>
      </div>
      <p class="message" id="message" role="status" hidden></p>
      <section class="history-section" aria-label="Recent sessions"><div class="history-heading"><h2>Recent sessions <span id="history-count">0</span></h2><button class="text-button" id="clear-history" hidden>Clear history</button></div><div id="history"><div class="empty-history">No sessions yet</div></div></section>
    </main>
  </div>
  <dialog id="start-dialog"><form method="dialog" id="start-form"><div class="dialog-heading"><h2>Adjust your start time</h2><button class="close-button" value="cancel" aria-label="Close">×</button></div><p>Earnings will be recalculated from this time using your session’s hourly rate.</p><label for="adjust-start">Session started at</label><input type="datetime-local" id="adjust-start" required><p class="dialog-error" id="dialog-error" role="alert"></p><button class="primary" id="apply-start" value="apply">Save start time</button></form></dialog>
</body>
</html>
